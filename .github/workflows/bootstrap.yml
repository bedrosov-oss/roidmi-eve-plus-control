name: Bootstrap ROIDMI repository

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/READY'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source tree
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/source.b64.part??? > /tmp/roidmi-source.b64
          base64 -d /tmp/roidmi-source.b64 > /tmp/roidmi-source.tgz
          tar -xzf /tmp/roidmi-source.tgz -C .
          rm -rf bootstrap
          python tools/build_release.py

      - name: Commit repository and update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish ROIDMI EVE Plus Control v21.5" || true
          git push
