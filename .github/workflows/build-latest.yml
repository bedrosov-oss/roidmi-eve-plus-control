name: Build latest Windows package

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
      - 'releases/latest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate and build
        run: python tools/build_release.py

      - name: Commit update channel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ROIDMI_EVE_Plus_Control_Windows_latest.zip releases/latest.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "build: refresh latest package [skip ci]"
            git push
          fi
